name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

  e2e-browser:
    name: Browser E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install pinned Playwright CLI & Chromium browser
        run: |
          npm install -g @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
          playwright-cli install-browser --list

      - name: Run E2E-A through E2E-I browser smoke tests (non-billable)
        env:
          NODE_ENV: production
          PORT: 3000
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          mkdir -p .playwright-cli
          node server.ts >.playwright-cli/e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf "$E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 0.5
          done
          HEALTH_JSON="$(curl -sf "$E2E_BASE_URL/api/health")"
          echo "Server health: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"configured":false' || {
            echo "ERROR: Expected key-free test server (configured:false) for non-billable CI" >&2
            exit 1
          }
          bash scripts/e2e-browser-smoke.sh

      - name: Upload Playwright screenshots, traces, results & server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          retention-days: 14
          path: |
            .playwright-cli/*.png
            .playwright-cli/*.zip
            .playwright-cli/e2e-results.json
            .playwright-cli/e2e-server.log
            .playwright-cli/console-*.log
          if-no-files-found: ignore

