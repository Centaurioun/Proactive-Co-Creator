name: Dependency latest experiment (TypeScript held)

on:
  push:
    branches:
      - experiment/dependencies-latest-except-typescript-2026-11-24
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dependency-latest-experiment
  cancel-in-progress: true

jobs:
  resolve:
    name: Restore and verify exact previously tested dependency candidate
    if: github.ref == 'refs/heads/experiment/dependencies-latest-except-typescript-2026-11-24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-dependency-candidate
          run-id: 45330987801
          github-token: ${{ github.token }}
          path: .
      - name: Verify exact candidate hashes
        run: |
          sha256sum -c <<'HASHES'
          83dd1100128eed3a8170d728d08074237c9bd7943e44a134f0042b253aa40fda  package.json
          729ead5ed6651b02eba5579acc38974cd7580c12320ca52a5ccd3c0ff02a1d09  package-lock.json
          344c4201fd5e30e0e80dfb24afdcb2ea6f345e6b66437233768abe5dda7779cb  dependency-experiment/versions.json
          HASHES
      - name: Export exact public dependency files for connector publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          for (const file of ['package.json', 'package-lock.json']) {
            const bytes = fs.readFileSync(file);
            const b64 = bytes.toString('base64');
            const parts = b64.match(/.{1,4096}/g);
            console.log('CANDIDATE_HEADER ' + file + ' ' + parts.length + ' ' + crypto.createHash('sha256').update(bytes).digest('hex'));
            parts.forEach((part,i) => console.log('CANDIDATE_B64 ' + file + ' ' + i + ' ' + part));
          }
          NODE
      - name: Upload exact candidate for verification jobs
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: |
            package.json
            package-lock.json
            dependency-experiment/versions.json
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Candidate verify (Node ${{ matrix.node }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '26.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ''
      API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: .
      - name: Install exact candidate and check peer dependencies
        id: candidate_install
        run: |
          npm ci --include=dev --include=optional --strict-peer-deps
          npm ls --depth=0
          node --version
          npm --version
          ./node_modules/.bin/tsc --version
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run lint
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm test
      - name: Production build
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run build
      - name: Server import
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: node -e 'import("./server.ts").then(m => { if (typeof m.createApp !== "function") process.exit(1) })'
      - name: Dependency audit (record only; no automated fix)
        if: always()
        run: |
          mkdir -p dependency-experiment
          set +e
          npm audit --json > dependency-experiment/audit.json
          echo "$?" > dependency-experiment/audit-exit-code.txt
          npm audit --omit=dev --json > dependency-experiment/audit-production.json
          echo "$?" > dependency-experiment/audit-production-exit-code.txt
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-audit-node-${{ matrix.node }}
          path: dependency-experiment/
          if-no-files-found: warn

  browser:
    name: Candidate browser E2E (Node 22)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 3000
      E2E_BASE_URL: http://127.0.0.1:3000
      GEMINI_API_KEY: ''
      API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/download-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: .
      - run: npm ci --include=dev --include=optional --strict-peer-deps
      - run: npm run build
      - name: Install existing pinned browser CLI
        run: |
          npm install -g @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
      - name: Record browser and environment metadata
        run: |
          mkdir -p .playwright-cli
          { node --version; npm --version; uname -sm; npm list -g @playwright/cli --depth=0; playwright-cli install-browser --list; } > .playwright-cli/browser-environment.txt 2>&1
      - name: Execute qualified Stage 0 browser suite
        env:
          NODE_ENV: production
        run: |
          mkdir -p .playwright-cli
          node server.ts >.playwright-cli/e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf "$E2E_BASE_URL/api/health" >/dev/null; then break; fi
            sleep 0.5
          done
          HEALTH_JSON="$(curl -sf "$E2E_BASE_URL/api/health")"
          echo "$HEALTH_JSON" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).configured!==false)process.exit(1)})'
          E2E_ARTIFACT_DIAGNOSTIC=1 bash scripts/e2e-browser-smoke.sh
          bash scripts/e2e-browser-smoke.sh
      - name: Upload scoped diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-browser-diagnostics
          include-hidden-files: true
          path: |
            .playwright-cli/*.png
            .playwright-cli/*.zip
            .playwright-cli/e2e-results.json
            .playwright-cli/e2e-server.log
            .playwright-cli/browser-environment.txt
            .playwright-cli/browser-logs.json
            .playwright-cli/controlled-failure-results.json
          if-no-files-found: error
