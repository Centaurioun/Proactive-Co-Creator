name: Dependency latest experiment (TypeScript held)

on:
  push:
    branches:
      - experiment/dependencies-latest-except-typescript-2026-11-24
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-latest-experiment
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve all direct latest stable packages except TypeScript
    if: github.ref == 'refs/heads/experiment/dependencies-latest-except-typescript-2026-11-24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Resolve stable dist-tags and record exact candidate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rows = [];
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [name, range] of Object.entries(manifest[section])) {
              const old = lock.packages['node_modules/' + name]?.version;
              if (!old) throw new Error('Missing locked direct package: ' + name);
              const version = name === 'typescript' ? old : JSON.parse(execFileSync('npm', ['view', name + '@latest', 'version', '--json'], {encoding: 'utf8', timeout: 30000}));
              if (typeof version !== 'string' || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected stable version for ' + name + ': ' + JSON.stringify(version));
              manifest[section][name] = version;
              rows.push({section, name, previousRange: range, previousVersion: old, candidateVersion: version, changed: old !== version});
              console.log(name + ': ' + old + ' -> ' + version + (name === 'typescript' ? ' (held)' : ''));
            }
          }
          fs.mkdirSync('dependency-experiment', {recursive:true});
          fs.writeFileSync('dependency-experiment/versions.json', JSON.stringify(rows, null, 2) + '\n');
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rows = JSON.parse(fs.readFileSync('dependency-experiment/versions.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for (const row of rows) assert.equal(lock.packages['node_modules/'+row.name]?.version,row.candidateVersion,row.name);
          console.log('Resolved lock matches every exact requested direct version.');
          NODE
      - name: Upload candidate manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: |
            package.json
            package-lock.json
            dependency-experiment/versions.json
          if-no-files-found: error
          retention-days: 14
      - name: Save resolved version inventory even on resolution failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-resolution-diagnostics
          path: dependency-experiment/versions.json
          if-no-files-found: warn

  verify:
    name: Candidate verify (Node ${{ matrix.node }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '26.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ''
      API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: .
      - name: Install exact candidate and check peer dependencies
        run: |
          npm ci --strict-peer-deps
          npm ls --depth=0
          node --version
          npm --version
          ./node_modules/.bin/tsc --version
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Unit and integration tests
        if: success() || failure()
        run: npm test
      - name: Production build
        if: success() || failure()
        run: npm run build
      - name: Server import
        if: success() || failure()
        run: node -e 'import("./server.ts").then(m => { if (typeof m.createApp !== "function") process.exit(1) })'
      - name: Dependency audit (record only; no automated fix)
        if: always()
        run: |
          mkdir -p dependency-experiment
          set +e
          npm audit --json > dependency-experiment/audit.json
          echo "$?" > dependency-experiment/audit-exit-code.txt
          npm audit --omit=dev --json > dependency-experiment/audit-production.json
          echo "$?" > dependency-experiment/audit-production-exit-code.txt
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-audit-node-${{ matrix.node }}
          path: dependency-experiment/
          if-no-files-found: warn

  browser:
    name: Candidate browser E2E (Node 22)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PORT: 3000
      E2E_BASE_URL: http://127.0.0.1:3000
      GEMINI_API_KEY: ''
      API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/download-artifact@v4
        with:
          name: resolved-dependency-candidate
          path: .
      - run: npm ci --strict-peer-deps
      - run: npm run build
      - name: Install existing pinned browser CLI
        run: |
          npm install -g @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
      - name: Execute unchanged Stage 0 browser suite
        run: |
          mkdir -p .playwright-cli
          node server.ts >.playwright-cli/e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf "$E2E_BASE_URL/api/health" >/dev/null; then break; fi
            sleep 0.5
          done
          HEALTH_JSON="$(curl -sf "$E2E_BASE_URL/api/health")"
          echo "$HEALTH_JSON" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).configured!==false)process.exit(1)})'
          bash scripts/e2e-browser-smoke.sh
      - name: Upload scoped diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-browser-diagnostics
          include-hidden-files: true
          path: |
            .playwright-cli/*.png
            .playwright-cli/*.zip
            .playwright-cli/e2e-results.json
            .playwright-cli/e2e-server.log
            .playwright-cli/console-*.log
          if-no-files-found: warn
